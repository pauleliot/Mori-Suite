<!doctype html>
<!-- Mori : fenêtre invisible démarrée avec Premiere, elle tient le raccourci Ctrl+Espace de la console d'effets -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Mori Raccourci</title>
    <script>
      if (typeof require === 'function' && !window.cep_node) {
        window.cep_node = { require: require, process: typeof process !== 'undefined' ? process : undefined, Buffer: typeof Buffer !== 'undefined' ? Buffer : undefined };
      }
      try { window.module = undefined; window.exports = undefined; window.require = undefined; } catch (e) {}
    </script>
    <script src="./CSInterface.js"></script>
    <script src="./vendor/suite-theme.js"></script>
    <!-- réglages de la console (roue crantée) : mises à jour sans bandeau, rapport de diagnostic -->
    <script src="./vendor/suite-update.js" data-app="mori" data-name="Mori" data-silent="1"></script>
    <script src="./vendor/mori-diagnostic.js"></script>
    <script src="./vendor/mori-hotkey.js"></script>
  </head>
  <body>
    <script>
      if (window.MoriHotkey) window.MoriHotkey.start();
    </script>
  </body>
</html>
